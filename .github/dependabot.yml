# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    exclude-paths:
      - "requirements_test_floor.txt"
    ignore:
      # Home Assistant and its generated pytest helper must be updated together.
      # The helper exact-pins one Home Assistant release and also tracks betas.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
